[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-triage-portfolio"
version = "0.1.0"
description = "An explainable Gmail triage assistant, starting with a local preview."
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.24,<1", "langgraph>=1.2,<2",
    "google-api-python-client>=2,<3", "google-auth-oauthlib>=1,<2",
    "python-dotenv>=1,<2", "streamlit>=1.40,<2",
    "langgraph-checkpoint-sqlite>=3,<5",
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
    "SQLAlchemy>=2.0,<2.1", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4",
    "langgraph-checkpoint-postgres>=3,<4",
]

[tool.setuptools.packages.find]
include = ["triage*"]

[project.optional-dependencies]
deploy = ["bcrypt>=4,<6", "PyYAML>=6,<7"]

[tool.setuptools.package-data]
triage = ["migrations/*.py", "migrations/versions/*.py", "migrations/*.mako"]
